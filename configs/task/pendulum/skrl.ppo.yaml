# @package _global_
# Task pendulum: skrl.ppo shared training recipe.
defaults:
  - /algo_base@algo: skrl.ppo
  - _self_
task:
  env: pendulum
  rllib: skrl
  algo: ppo
  train_backend: null
num_envs: 2048
play_num_envs: 16
seed: 42
algo:
  models:
    policy:
      hiddens:
        - 64
        - 64
    value:
      hiddens:
        - 64
        - 64
  agent:
    learning_epochs: 5
    mini_batches: 4
    learning_rate: 0.0003
  trainer:
    timesteps: 5000
