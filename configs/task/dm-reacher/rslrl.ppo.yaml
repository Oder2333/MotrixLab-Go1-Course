# @package _global_
# Task dm-reacher: rslrl.ppo shared training recipe.
defaults:
  - /algo_base@algo: rslrl.ppo
  - _self_
task:
  env: dm-reacher
  rllib: rslrl
  algo: ppo
  train_backend: null
num_envs: 2048
play_num_envs: 16
seed: 42
algo:
  max_iterations: 100
  actor:
    hidden_dims:
      - 32
      - 32
      - 32
  critic:
    hidden_dims:
      - 32
      - 32
      - 32
  algorithm:
    learning_rate: 0.0002
    num_learning_epochs: 4
