# @package _global_
# Task franka-open-cabinet: skrl.ppo shared training recipe.
defaults:
  - /algo_base@algo: skrl.ppo
  - _self_
task:
  env: franka-open-cabinet
  rllib: skrl
  algo: ppo
  train_backend: null
num_envs: 2048
play_num_envs: 16
seed: 64
algo:
  agent:
    rollouts: 16
    learning_epochs: 5
    learning_rate: 0.0003
    entropy_loss_scale: 0.001
    rewards_shaper_scale: 0.1
  trainer:
    timesteps: 24000
