# @package _global_
# Task k1-wbt-freekick: manager-based K1 free-kick tracking with Motrix FastSAC.
defaults:
  - /algo_base@algo: motrix.fastsac
  - _self_
task:
  env: k1-wbt-freekick
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 1000
algo:
  agent:
    num_updates: 4
    policy_frequency: 2
    gamma: 0.99
    tau: 0.05
    target_entropy_ratio: 0.5
    num_atoms: 501
  trainer:
    num_learning_iterations: 10000
    async_options:
      # Keep the WBT training UTD fixed at four updates per ingested batch.
      utd_mode: strict
