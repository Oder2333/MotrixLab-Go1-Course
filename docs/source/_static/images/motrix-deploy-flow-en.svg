<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Motrix Deploy workflow</title>
  <desc id="desc">A training run is exported into a Deployment Artifact, loaded by Motrix Deploy Runtime, and executed through a MuJoCo Sim2Sim or hardware backend.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; fill: #475569; }
      .label { font-size: 16px; font-weight: 600; fill: #475569; }
      .card { stroke-width: 2; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="388" rx="22" fill="#f8fafc" stroke="#dbe4f0" stroke-width="2"/>

  <rect class="card" x="40" y="115" width="230" height="150" rx="18" fill="#e8f1ff" stroke="#6c9ee8"/>
  <text class="title" x="155" y="165" text-anchor="middle">Training Run</text>
  <text class="body" x="155" y="207" text-anchor="middle">metadata + checkpoint</text>

  <path class="arrow" d="M270 190 H385"/>
  <text class="label" x="327" y="145" text-anchor="middle">
    <tspan x="327" dy="0">Export policy</tspan>
    <tspan x="327" dy="24">Compile contracts</tspan>
  </text>

  <rect class="card" x="395" y="90" width="310" height="200" rx="18" fill="#ecfdf5" stroke="#4eaa82"/>
  <text class="title" x="550" y="140" text-anchor="middle">Deployment Artifact</text>
  <text class="body" x="550" y="184" text-anchor="middle">Policy</text>
  <text class="body" x="550" y="219" text-anchor="middle">RobotSpec · TaskSpec</text>
  <text class="body" x="550" y="254" text-anchor="middle">ControlSpec</text>

  <path class="arrow" d="M705 190 H815"/>
  <text class="label" x="760" y="153" text-anchor="middle">
    <tspan x="760" dy="0">Inspect</tspan>
    <tspan x="760" dy="24">Load</tspan>
  </text>

  <rect class="card" x="825" y="90" width="270" height="200" rx="18" fill="#fff7e8" stroke="#d99935"/>
  <text class="title" x="960" y="140" text-anchor="middle">Motrix Deploy Runtime</text>
  <text class="body" x="960" y="184" text-anchor="middle">Task semantics</text>
  <text class="body" x="960" y="219" text-anchor="middle">Policy inference</text>
  <text class="body" x="960" y="254" text-anchor="middle">Control loop</text>

  <path d="M1095 190 H1140" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="1140" cy="190" r="5" fill="#64748b"/>
  <path class="arrow" d="M1140 190 V125 H1190"/>
  <path class="arrow" d="M1140 190 V270 H1190"/>
  <text class="label" x="1145" y="65" text-anchor="middle">Target Backend</text>
  <text class="label" x="1130" y="225" text-anchor="end">State ↔ Control</text>

  <rect class="card" x="1200" y="75" width="165" height="100" rx="16" fill="#eef2ff" stroke="#7c83d6"/>
  <text class="title" x="1282" y="115" text-anchor="middle">Sim2Sim</text>
  <text class="body" x="1282" y="148" text-anchor="middle">MuJoCo · Supported</text>

  <rect class="card" x="1200" y="220" width="165" height="100" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="title" x="1282" y="280" text-anchor="middle">Hardware</text>
</svg>
